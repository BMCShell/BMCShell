name: Sync framework release index

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: bmcshell-core-release-index
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'BMCShell/BMCShell' && (github.event_name != 'release' || github.event.release.tag_name != 'release-index')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Build and publish index
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $index = Join-Path $env:RUNNER_TEMP 'bmcshell-core-index.json'
          ./scripts/build-core-release-index.ps1 -Output $index
          ./scripts/publish-core-release-index.ps1 -IndexPath $index
